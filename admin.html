<!DOCTYPE html>
<html lang="sk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | TOMIKON</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-page{
    min-height:100vh;
    padding:60px 20px;
    max-width:1100px;
    margin:auto;
}

.admin-login,
.admin-panel{
    max-width:600px;
    margin:auto;
}

.admin-box{
    background:#0b0b0b;
    border:1px solid #008cff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 30px rgba(0,140,255,.15);
}

.admin-box h1{
    margin-top:0;
}

.admin-box input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin:8px 0 15px;
    background:#111;
    color:white;
    border:1px solid #008cff;
    border-radius:8px;
}

.admin-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#008cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.admin-button:hover{
    opacity:.85;
}

.logout-button{
    background:#e53935;
    max-width:150px;
    margin-bottom:30px;
}

.review-card{
    background:#0b0b0b;
    border:1px solid #008cff;
    border-radius:15px;
    padding:25px;
    margin-bottom:20px;
}

.review-stars{
    color:#ffd700;
    font-size:20px;
}

.review-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.approve-button{
    background:#16b96b;
}

.delete-button{
    background:#e53935;
}

.review-actions button{
    border:0;
    padding:10px 18px;
    border-radius:7px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.hidden{
    display:none;
}

#error{
    color:#ff5555;
    margin-top:15px;
}

</style>

</head>

<body>

<section class="admin-page">

<!-- PRIHLÁSENIE -->

<div id="loginSection" class="admin-login">

<div class="admin-box">

<h1>🔐 TOMIKON Admin</h1>

<p>Prihlás sa do administrácie.</p>

<form id="loginForm">

<label>E-mail</label>

<input
type="email"
id="email"
placeholder="admin@email.sk"
required
>

<label>Heslo</label>

<input
type="password"
id="password"
placeholder="••••••••"
required
>

<button
type="submit"
class="admin-button">

Prihlásiť sa

</button>

</form>

<p id="error"></p>

</div>

</div>


<!-- ADMIN PANEL -->

<div id="adminSection" class="admin-panel hidden">

<h1>⭐ TOMIKON Admin</h1>

<button
id="logoutButton"
class="admin-button logout-button">

Odhlásiť

</button>

<h2>Recenzie čakajúce na schválenie</h2>

<div id="reviews">

Načítavam recenzie...

</div>

</div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>

</body>

</html>
