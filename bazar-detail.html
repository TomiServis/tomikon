<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Detail inzerátu | TOMIKON BAZÁR</title>

<link rel="stylesheet" href="bazar-detail.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.detail-page{
    max-width:1200px;
    margin:auto;
    padding:35px 20px 80px;
}

.detail-header{
    text-align:center;
    margin-bottom:30px;
}

.detail-header h1{
    margin:0 0 8px;
    font-size:32px;
}

.detail-header p{
    color:#aaa;
    margin:0 0 18px;
}

.bazar-button{
    display:inline-block;
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#008cff;
    color:#fff;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

.detail-box{
    background:#0b0b0b;
    border:1px solid #008cff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,140,255,.12);
}

.detail-layout{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:30px;
}

/* =========================
   FOTKY
========================= */

.main-image-wrapper{
    width:100%;
    aspect-ratio:16/10;
    background:#111;
    border:1px solid #222;
    border-radius:14px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

#mainImage{
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:pointer;
}

.thumbnails{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.thumbnail{
    width:90px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid #222;
    cursor:pointer;
    transition:.2s;
}

.thumbnail:hover{
    border-color:#008cff;
    transform:scale(1.03);
}

.thumbnail.active{
    border-color:#008cff;
    box-shadow:0 0 10px rgba(0,140,255,.5);
}

/* =========================
   INFORMÁCIE
========================= */

.detail-info{
    display:flex;
    flex-direction:column;
}

.detail-category{
    color:#888;
    font-size:14px;
    margin-bottom:8px;
}

.detail-title{
    font-size:32px;
    margin:0 0 15px;
}

.detail-price{
    color:#008cff;
    font-size:32px;
    font-weight:bold;
    margin-bottom:25px;
}

.info-row{
    display:flex;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #222;
}

.info-label{
    color:#888;
    min-width:100px;
}

.info-value{
    color:#fff;
    word-break:break-word;
}

.description-box{
    margin-top:30px;
}

.description-box h2{
    margin-bottom:12px;
}

.description{
    color:#ccc;
    line-height:1.7;
    white-space:pre-wrap;
}

.contact-box{
    margin-top:30px;
    padding:18px;
    background:#111;
    border:1px solid #222;
    border-radius:12px;
}

.contact-box h3{
    margin-top:0;
}

.contact{
    font-size:18px;
    color:#008cff;
    font-weight:bold;
    word-break:break-word;
}

/* =========================
   LOADING / ERROR
========================= */

.status-box{
    text-align:center;
    padding:80px 20px;
    background:#0b0b0b;
    border:1px solid #008cff;
    border-radius:16px;
}

.error{
    color:#ff4d6d;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .detail-layout{
        grid-template-columns:1fr;
    }

    .detail-title{
        font-size:26px;
    }

    .detail-price{
        font-size:28px;
    }

}

@media(max-width:500px){

    .detail-page{
        padding:20px 12px 50px;
    }

    .detail-box{
        padding:15px;
    }

    .detail-header h1{
        font-size:26px;
    }

    .thumbnail{
        width:75px;
        height:60px;
    }

}
</style>
</head>

<body>

<header class="topbar">

    <a
        href="bazar.html"
        class="topbar-logo bazar-logo-link"
    >
        🛒
        <span>TOMIKON</span>
        <small>BAZÁR</small>
    </a>

    <div class="topbar-user">

        <a
            href="bazar.html"
            class="topbar-btn"
        >
            ← Späť na bazár
        </a>

    </div>

</header>


<main class="detail-page">

    <header class="detail-header">

        <h1>
            Detail inzerátu
        </h1>

        <p>
            Podrobnosti ponuky
        </p>

    </header>


    <!-- =========================
         NAČÍTAVANIE
    ========================= -->

    <div
        id="loadingBox"
        class="status-box"
    >

        ⏳ Načítavam inzerát...

    </div>


    <!-- =========================
         DETAIL
    ========================= -->

    <div
        id="detailBox"
        class="detail-box"
        style="display:none;"
    >

        <div class="detail-layout">

            <!-- FOTKY -->

            <div>

                <div class="main-image-wrapper">

                    <img
                        id="mainImage"
                        src=""
                        alt="Inzerát"
                    >

                </div>


                <div
                    id="thumbnails"
                    class="thumbnails"
                ></div>

            </div>


            <!-- INFORMÁCIE -->

            <div class="detail-info">

                <div
                    id="detailCategory"
                    class="detail-category"
                ></div>


                <h2
                    id="detailTitle"
                    class="detail-title"
                ></h2>


                <div
                    id="detailPrice"
                    class="detail-price"
                ></div>


                <div class="info-row">

                    <div class="info-label">
                        📍 Mesto
                    </div>

                    <div
                        id="detailCity"
                        class="info-value"
                    ></div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        📅 Pridané
                    </div>

                    <div
                        id="detailDate"
                        class="info-value"
                    ></div>

                </div>


                <div class="contact-box">

                    <h3>
                        📞 Kontakt na predajcu
                    </h3>

                    <div
                        id="detailContact"
                        class="contact"
                    ></div>

                </div>

            </div>

        </div>


        <!-- POPIS -->

        <div class="description-box">

            <h2>
                📝 Popis inzerátu
            </h2>

            <div
                id="detailDescription"
                class="description"
            ></div>

        </div>

    </div>


    <!-- CHYBA -->

    <div
        id="errorBox"
        class="status-box"
        style="display:none;"
    >

        <div class="error">
            ❌ Inzerát sa nepodarilo nájsť.
        </div>

        <br>

        <a
            href="bazar.html"
            class="bazar-button"
        >
            ← Späť na bazár
        </a>

    </div>

</main>


<!-- =========================
     FULLSCREEN GALÉRIA
========================= -->

<div id="imageModal">

    <button
        id="closeImageModal"
        class="gallery-close"
        type="button"
    >
        ×
    </button>


    <button
        id="prevImage"
        class="gallery-arrow gallery-prev"
        type="button"
    >
        ‹
    </button>


    <div class="gallery-content">

        <img
            id="modalImage"
            src=""
            alt="Fotka inzerátu"
        >

        <div
            id="imageCounter"
            class="image-counter"
        >
            1 / 1
        </div>

    </div>


    <button
        id="nextImage"
        class="gallery-arrow gallery-next"
        type="button"
    >
        ›
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="bazar-detail.js"></script>

</body>
</html>
