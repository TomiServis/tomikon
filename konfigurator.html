```html
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMIKON Konfigurátor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
padding:40px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:40px;
}

.step{
background:#111;
padding:30px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(0,140,255,.3);
}

h2{
margin-bottom:20px;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.choice{
padding:15px 25px;
background:#1a1a1a;
border:1px solid #333;
border-radius:15px;
cursor:pointer;
}

.choice:hover{
border-color:#008cff;
}

.range{
width:100%;
margin-top:20px;
}

.result{
background:#111;
padding:30px;
border-radius:20px;
margin-top:30px;
border:1px solid rgba(0,140,255,.3);
}

.price{
font-size:40px;
color:#008cff;
margin-top:15px;
}

</style>
</head>
<body>

<div class="container">

<h1>🖥️ TOMIKON PC Konfigurátor</h1>

<div class="step">

<h2>1. Na čo bude PC?</h2>

<div class="buttons">

<div class="choice">🎮 Gaming</div>
<div class="choice">🎥 Streaming</div>
<div class="choice">🎬 Strih videa</div>
<div class="choice">🏢 Kancelária</div>

</div>

</div>

<div class="step">

<h2>2. Rozpočet</h2>

<input
class="range"
type="range"
min="500"
max="2500"
step="100"
value="1000"
id="budget"
>

<div class="price">
<span id="budgetValue">1000</span> €
</div>

</div>

<div class="result">

<h2>Odporúčaná zostava</h2>

<p id="cpu">CPU: Ryzen 5 5600</p>
<p id="gpu">GPU: RTX 4060</p>
<p id="ram">RAM: 16GB DDR4</p>
<p id="ssd">SSD: 1TB NVMe</p>

</div>

</div>

<script>

const budget=document.getElementById('budget');

budget.addEventListener('input',()=>{

const value=parseInt(budget.value);

document.getElementById('budgetValue').innerText=value;

if(value<900){

cpu.innerText='CPU: Ryzen 5 5600';
gpu.innerText='GPU: RTX 4060';
ram.innerText='RAM: 16GB DDR4';
ssd.innerText='SSD: 1TB NVMe';

}

else if(value<1400){

cpu.innerText='CPU: Ryzen 7 5700X';
gpu.innerText='GPU: RTX 4070';
ram.innerText='RAM: 32GB DDR4';
ssd.innerText='SSD: 1TB NVMe';

}

else if(value<1900){

cpu.innerText='CPU: Ryzen 7 7800X3D';
gpu.innerText='GPU: RTX 5070';
ram.innerText='RAM: 32GB DDR5';
ssd.innerText='SSD: 2TB NVMe';

}

else{

cpu.innerText='CPU: Ryzen 9 9950X';
gpu.innerText='GPU: RTX 5080';
ram.innerText='RAM: 64GB DDR5';
ssd.innerText='SSD: 2TB NVMe';

}

});

</script>

</body>
</html>
```
