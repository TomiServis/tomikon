<!doctype html>
<html lang="sk">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Moje inzeráty | TOMIKON BAZÁR</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bazar.css">

<style>

.my-page {
    max-width: 1250px;
    margin: 0 auto;
    padding: 45px 25px 90px;
}

.my-header {
    text-align: center;
    margin-bottom: 30px;
}

.my-header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.my-header p {
    color: #999;
}

.my-back {
    display: inline-block;
    margin-top: 15px;
}

.my-listings-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.my-card {
    background:
        linear-gradient(
            145deg,
            #101010,
            #080808
        );

    border: 1px solid #292929;

    border-radius: 15px;

    padding: 20px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.my-card:hover {
    border-color: #008cff;

    box-shadow:
        0 0 18px rgba(0,140,255,.16);
}

.my-status {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 12px;
    font-weight: 800;

    margin-bottom: 12px;
}

.my-status.approved {
    background: rgba(0,200,100,.12);
    color: #00d084;
    border: 1px solid rgba(0,200,100,.3);
}

.my-status.pending {
    background: rgba(255,180,0,.12);
    color: #ffbd00;
    border: 1px solid rgba(255,180,0,.3);
}

.my-card h2 {
    margin: 8px 0;

    font-size: 21px;
}

.my-price {
    color: #008cff;

    font-size: 25px;

    font-weight: 900;

    margin: 10px 0;
}

.my-info {
    color: #999;

    font-size: 14px;

    line-height: 1.7;
}

.my-open {
    display: inline-block;

    margin-top: 15px;

    padding: 10px 15px;

    border-radius: 8px;

    background: #008cff;

    color: white;

    text-decoration: none;

    font-weight: 700;

    font-size: 13px;
}

.my-open:hover {
    background: #009cff;
}

#myMessage {
    text-align: center;

    padding: 50px 20px;

    color: #aaa;
}

@media (max-width: 850px) {

    .my-listings-grid {
        grid-template-columns: 1fr 1fr;
    }

}

@media (max-width: 550px) {

    .my-page {
        padding: 30px 15px 60px;
    }

    .my-header h1 {
        font-size: 30px;
    }

    .my-listings-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="topbar-logo">

        🛒

        <span>TOMIKON</span>

        <small>BAZÁR</small>

    </div>


    <div class="topbar-user">

        <button
            id="backBazarButton"
            class="topbar-btn">

            ← Späť na bazár

        </button>

    </div>

</header>



<main class="my-page">


    <header class="my-header">

        <h1>
            📦 Moje inzeráty
        </h1>

        <p id="myUserEmail">
            Načítavam účet...
        </p>

    </header>


    <section>

        <div
            id="myListings"
            class="my-listings-grid"
        >

            <div id="myMessage">
                ⏳ Načítavam tvoje inzeráty...
            </div>

        </div>

    </section>


</main>

    <!-- EDIT MODAL -->
<div id="editModal" class="edit-modal">

    <div class="edit-box">

        <button id="closeEditModal" class="edit-close">
            ✕
        </button>

        <h2>✏️ Upraviť inzerát</h2>

        <form id="editForm">

            <input type="hidden" id="editId">

            <label>Názov</label>
            <input id="editTitle" required>

            <label>Kategória</label>
            <select id="editCategory" required>
                <option value="">Vyber kategóriu</option>
                <option>Stolný PC</option>
                <option>Notebook</option>
                <option>Grafická karta</option>
                <option>Procesor</option>
                <option>RAM</option>
                <option>SSD / HDD</option>
                <option>Monitor</option>
                <option>Príslušenstvo</option>
                <option>Iné</option>
            </select>

            <label>Cena (€)</label>
            <input
                id="editPrice"
                type="number"
                min="0"
                step="0.01"
                required
            >

            <label>Mesto</label>
            <input id="editCity" required>

            <label>Kontakt</label>
            <input id="editContact" required>

            <label>Popis</label>
            <textarea
                id="editDescription"
                required
            ></textarea>

            <div class="edit-actions">

                <button
                    type="button"
                    id="cancelEdit"
                    class="edit-cancel"
                >
                    Zrušiť
                </button>

                <button
                    type="submit"
                    class="edit-save"
                >
                    💾 Uložiť zmeny
                </button>

            </div>

            <p id="editMessage"></p>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="moje-inzeraty.js"></script>


</body>

</html>
